name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/careerpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: API tests (includes the extraction eval gate and grounding checks)
        run: npm test
      - name: Extraction eval report
        run: npm run eval -- --verbose
        env: { DATABASE_URL: postgres://postgres:postgres@localhost:5432/careerpilot_test, EMBEDDINGS: "off" }
      - name: Web build
        run: npm run build -w apps/web
